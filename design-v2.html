<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>潘楚柔 · 作品集首页设计稿 V4</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300;1,9..144,360&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f7f7f5;
    --ink: #141414;
    --muted: #7a7a74;
    --gold: #8a6a2e;
    --gold-soft: rgba(138,106,46,.28);
    --pw: 198px;
    --ph: 248px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans SC", sans-serif;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 6;
    opacity: .14;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }
  .home {
    height: 100vh;
    display: grid;
    grid-template-rows: auto auto 1fr auto;
    padding: 20px 42px 16px;
  }
  .nav {
    display: flex; justify-content: space-between; align-items: center;
    position: relative; z-index: 8;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px; letter-spacing: .22em; font-weight: 500;
  }
  .bars { width: 16px; height: 14px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2px; }
  .bars i { background: var(--ink); }
  .bars i:nth-child(2) { background: var(--gold); }
  .links {
    display: flex; gap: 22px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px; letter-spacing: .14em; color: var(--muted);
  }
  .links b { color: var(--ink); font-weight: 500; position: relative; }
  .links b::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -7px;
    height: 1px; background: var(--gold);
  }
  .mast {
    margin-top: 18px;
    position: relative; z-index: 8;
  }
  .mast h1 {
    font-weight: 900;
    font-size: clamp(40px, 5.6vw, 76px);
    letter-spacing: -.05em;
    line-height: .92;
  }
  .mast h1 span {
    display: block;
    margin-top: 8px;
    font-family: Fraunces, serif;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(24px, 3vw, 38px);
    letter-spacing: -.02em;
    color: var(--gold);
    line-height: 1;
  }
  .stage {
    position: relative;
    min-height: 0;
    perspective: 1800px;
    cursor: grab;
    user-select: none;
  }
  .stage:active { cursor: grabbing; }
  .fog {
    position: absolute; inset: 0; pointer-events: none; z-index: 3;
    background: linear-gradient(90deg, var(--bg) 0%, transparent 8%, transparent 92%, var(--bg) 100%);
  }
  .glow {
    position: absolute; left: 50%; bottom: 18%;
    width: 72%; height: 64px; transform: translateX(-50%);
    background: radial-gradient(ellipse at center, var(--gold-soft), rgba(255,255,255,0) 72%);
    filter: blur(14px);
    z-index: 0;
  }
  .world {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    transform: rotateX(-18deg);
  }
  .spin {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
  }
  .panel {
    position: absolute; left: 50%; top: 48%;
    width: var(--pw); height: var(--ph);
    margin-left: calc(var(--pw) / -2);
    margin-top: calc(var(--ph) / -2);
  }
  .face {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #d8d8d4;
    box-shadow: 0 18px 30px rgba(20,20,20,.14);
  }
  .face img, .face .ph {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .ph { display: flex; align-items: flex-end; padding: 16px; color: #f3f1ea; font-weight: 700; }
  .sea { background: linear-gradient(165deg, #2a3340, #12161c 60%, #8a6a2e); }
  .hint {
    text-align: center;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px; letter-spacing: .12em; color: var(--muted);
    position: relative; z-index: 4;
  }
  @media (max-width: 900px) {
    .links { display: none; }
    .home { padding: 18px 18px 14px; }
    :root { --pw: 118px; --ph: 166px; }
    .mast h1 { font-size: 36px; }
  }
</style>
</head>
<body>
  <section class="home">
    <header class="nav">
      <div class="brand"><span class="bars"><i></i><i></i><i></i></span>PAN CHUROU</div>
      <div class="links"><b>001 REEL</b><span>002 履历</span><span>003 AI</span><span>004 影像</span><span>005 平面</span></div>
    </header>
    <div class="mast">
      <h1>潘楚柔的作品集<span>in one turn</span></h1>
    </div>
    <div class="stage" id="stage">
      <div class="glow"></div>
      <div class="world">
        <div class="spin" id="spin"></div>
      </div>
      <div class="fog"></div>
    </div>
    <p class="hint">DRAG TO TURN · 拖动查看作品</p>
  </section>
<script>
const items = [
  { img: "assets/github-cover.jpg" },
  { img: "assets/web-teacher-cover.jpg" },
  { img: "assets/web-betterwork-cover.jpg" },
  { ph: "sea", title: "中国航海日" },
  { img: "assets/poster-recruit-banner.jpg" },
  { img: "assets/poster-workshop.jpg" },
  { img: "assets/wechat-cover.jpg" },
  { img: "assets/poster-flyer-front.jpg" },
  { img: "assets/poster-form-front.jpg" },
  { img: "assets/poster-flyer-back.jpg" }
];
function face(it) {
  return it.img
    ? '<img src="' + it.img + '" alt="">'
    : '<div class="ph ' + it.ph + '">' + it.title + "</div>";
}
const n = items.length;
const step = 10.2;
const radius = 760;
const pull = 500;
const dip = 150;
document.getElementById("spin").innerHTML = items.map(function (it, i) {
  const angle = (i - (n - 1) / 2) * step;
  return '<article class="panel" data-angle="' + angle + '"><div class="face">' + face(it) + "</div></article>";
}).join("");
const spin = document.getElementById("spin");
const panels = [...spin.querySelectorAll(".panel")];
const stage = document.getElementById("stage");
let rot = 0, drag = false, last = 0, auto = true;
function layout() {
  panels.forEach(function (el) {
    const a = parseFloat(el.dataset.angle) + rot;
    const rad = a * Math.PI / 180;
    const y = dip * (Math.cos(rad) - 1);
    el.style.transform = "rotateY(" + a + "deg) translateZ(" + radius + "px) translateY(" + y + "px)";
  });
  spin.style.transform = "translateZ(-" + pull + "px)";
}
layout();
setInterval(function () { if (auto && !drag) { rot -= 0.08; layout(); } }, 16);
stage.addEventListener("pointerdown", function (e) { drag = true; auto = false; last = e.clientX; stage.setPointerCapture(e.pointerId); });
stage.addEventListener("pointermove", function (e) {
  if (!drag) return;
  rot += (e.clientX - last) * 0.12;
  last = e.clientX; layout();
});
window.addEventListener("pointerup", function () { drag = false; });
</script>
</body>
</html>
